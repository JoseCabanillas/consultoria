{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<style>
    body {
        background: url("{% static 'images/login_bg.jpg' %}") no-repeat center center fixed;
        background-size: cover;
    }
    .login-card {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        padding: 2rem;
        animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(-20px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .login-header {
        font-weight: bold;
        font-size: 1.5rem;
    }
    .login-icon {
        font-size: 2rem;
        margin-right: 10px;
    }
</style>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-5">
        <div class="login-card">
            <div class="text-center mb-4">
                <i class="bi bi-person-circle login-icon text-primary"></i>
                <span class="login-header text-primary">Bienvenido - Iniciar Sesión</span>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" autocomplete="off">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_usuario" class="form-label">
                        <i class="bi bi-person-fill"></i> Usuario
                    </label>
                    <input type="text" name="usuario" id="id_usuario" class="form-control" placeholder="Ingrese su usuario" autocomplete="off">
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">
                        <i class="bi bi-lock-fill"></i> Contraseña
                    </label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Ingrese su contraseña" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'servicio_publico' %}" class="text-decoration-none">
                    <i class="bi bi-arrow-left-circle"></i> Volver a la página pública
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
