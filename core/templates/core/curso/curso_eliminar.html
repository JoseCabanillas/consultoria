{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">🗑️ Confirmar eliminación de curso</h4>
        </div>
        <div class="card-body">
            <p class="fs-5">
                ¿Estás seguro de que deseas eliminar el curso 
                <strong>{{ object.nombre_curso }}</strong>?
            </p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    ✅ Sí, eliminar
                </button>
                <a href="{% url 'curso_lista' %}" class="btn btn-secondary">
                    ❌ Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
