{% extends "base.html" %}
{% block title %}Eliminar Docente{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-danger text-white">
        <h4><i class="bi bi-trash"></i> Confirmar Eliminación</h4>
    </div>
    <div class="card-body">
        <p>¿Estás seguro de que deseas eliminar al docente <strong>{{ object.priNombre }} {{ object.apePaterno }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Sí, eliminar
            </button>
            <a href="{% url 'docente_lista' %}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
